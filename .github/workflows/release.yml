# .github/workflows/release.yml
# Every pull request is scored by the gate. A merge to main that changes the model
# registers it as a new version, and a person approves it before it is deployed.
name: Release the model

on:
  pull_request:               # every pull request, so the required gate check always reports
  push:
    branches: [master]
    paths: [candidate/**]       # a merge that leaves the model alone releases nothing
  workflow_dispatch:


permissions:
  contents: read

#Why do we have fetch depth as zero? Because I want to compare the current branch candidate model file with the candidate model file of main branch.
jobs:
  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0              # the gate reads the model on main out of Git


      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the model library
        run: pip install xgboost==1.7.6 numpy

      - name: Score the candidate against the model on main
        run: python release/gate.py


  register:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.register.outputs.version }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the AWS SDK for Python
        run: pip install -r requirements.txt

      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2
          mask-aws-account-id: true

      - name: Register the model as a new version
        id: register
        run: python release/register.py

  deploy:
    needs: register
    runs-on: ubuntu-latest
    environment: production           # a reviewer approves here, before anything is deployed
    concurrency: production
    permissions:
      contents: read
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the AWS SDK for Python
        run: pip install -r requirements.txt

      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2
          mask-aws-account-id: true

      - name: Approve the version and deploy it
        run: python release/deploy.py ${{ needs.register.outputs.version }}

      - name: Check the live endpoint on 1,000 known bookings
        run: python release/check_live.py

